{% extends "base.html" %}

{% block content %}
<h1>Add a Plant</h1>

{% if species %}
<form method="POST" enctype="multipart/form-data">
    <label for="name">Plant Name:</label>
    <input type="text" id="name" name="name" placeholder="Optional (auto: Location + Species)">

    <label for="location">Location:</label>
    <input type="text" id="location" name="location" required placeholder="e.g. Living Room">

    <label for="species_id">Species:</label>
    <select id="species_id" name="species_id" required>
        <option value="">-- Select species --</option>
        {% for s in species %}
        <option value="{{ s.id }}">{{ s.name }} (every {{ s.watering_interval_days }} days)</option>
        {% endfor %}
    </select>

    <label for="photo">Photo:</label>
    <input type="file" id="photo" name="photo" accept="image/jpeg,image/png,image/webp" capture="environment">

    <button type="submit" class="btn">Add Plant</button>
</form>
{% else %}
<p>No species defined yet. <a href="{{ url_for('main.manage_species') }}">Add a species first</a>.</p>
{% endif %}
{% endblock %}
