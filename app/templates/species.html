{% extends "base.html" %}

{% block content %}
<h1>Manage Species</h1>

<form method="POST">
    <label for="name">Species Name:</label>
    <input type="text" id="name" name="name" required placeholder="e.g. Pothos">

    <label for="watering_interval_days">Watering Interval (days):</label>
    <input type="number" id="watering_interval_days" name="watering_interval_days" required min="1" placeholder="7">

    <label for="sunlight">Sunlight Requirements:</label>
    <input type="text" id="sunlight" name="sunlight" placeholder="e.g. Bright indirect light">

    <label for="soil_type">Soil Type:</label>
    <input type="text" id="soil_type" name="soil_type" placeholder="e.g. Well-draining potting mix">

    <label for="common_issues">Common Issues:</label>
    <textarea id="common_issues" name="common_issues" rows="2" placeholder="e.g. Yellow leaves from overwatering"></textarea>

    <label for="care_tips">Care Tips:</label>
    <textarea id="care_tips" name="care_tips" rows="2" placeholder="e.g. Let soil dry between waterings"></textarea>

    <button type="submit" class="btn">Add Species</button>
</form>

{% if species %}
<h2>Existing Species</h2>
<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Water Every</th>
            <th>Sunlight</th>
            <th>Details</th>
        </tr>
    </thead>
    <tbody>
        {% for s in species %}
        <tr>
            <td>{{ s.name }}</td>
            <td>{{ s.watering_interval_days }} days</td>
            <td>{{ s.sunlight or '—' }}</td>
            <td><a href="{{ url_for('main.species_detail', species_id=s.id) }}">View Care Info</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endif %}
{% endblock %}
