<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sproutz">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <title>Sproutz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <img src="{{ url_for('static', filename='icons/sproutz-icon.png') }}" alt="Sproutz" class="app-nav-icon">
        <a href="{{ url_for('main.dashboard') }}" aria-label="Dashboard"><img src="{{ url_for('static', filename='icons/dashboard-icon.png') }}" alt="" class="nav-icon-img"> <span class="nav-label">Dashboard</span></a>
        <a href="{{ url_for('main.index') }}" aria-label="My Plants"><img src="{{ url_for('static', filename='icons/my-plants-icon.png') }}" alt="" class="nav-icon-img"> <span class="nav-label">My Plants</span></a>
        <a href="{{ url_for('main.manage_species') }}" aria-label="Species"><img src="{{ url_for('static', filename='icons/species-icon.png') }}" alt="" class="nav-icon-img"> <span class="nav-label">Species</span></a>
        <form method="POST" action="{{ url_for('auth.logout') }}" class="nav-logout">
            <button type="submit" aria-label="Sign out" title="Sign out"><i class="bi bi-box-arrow-right"></i></button>
        </form>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <script>
    function openSnoozeModal(plantId, plantName) {
        const modal = document.getElementById('snooze-modal');
        const modalPlant = document.getElementById('snooze-modal-plant');
        const snoozeForm = document.getElementById('snooze-form');
        const snoozeDays = document.getElementById('snooze-days');
        if (!modal || !modalPlant || !snoozeForm || !snoozeDays) return;

        const wateringModal = document.getElementById('watering-modal');
        if (wateringModal) {
            wateringModal.classList.remove('active');
        }

        modalPlant.textContent = plantName;
        snoozeForm.action = '/plants/' + plantId + '/snooze';
        snoozeDays.value = 1;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function openSnoozeModalFromButton(button) {
        openSnoozeModal(button.dataset.plantId, button.dataset.plantName);
    }

    function closeSnoozeModal(event) {
        if (event && event.target !== event.currentTarget) return;
        const modal = document.getElementById('snooze-modal');
        if (!modal) return;
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    function selectSpeciesTab(tab) {
        const tabBar = tab.closest('.species-tabs');
        if (!tabBar) return;
        tabBar.querySelectorAll('.species-tab').forEach(function(item) {
            item.classList.remove('active');
            item.removeAttribute('aria-current');
        });
        tab.classList.add('active');
        tab.setAttribute('aria-current', 'page');
    }

    function initializeSpeciesTabs(root) {
        root.querySelectorAll('.species-tabs').forEach(function(tabBar) {
            if (tabBar._sectionObserver) {
                tabBar._sectionObserver.disconnect();
            }

            const tabTargets = Array.from(tabBar.querySelectorAll('.species-tab'))
                .map(function(tab) {
                    return {
                        tab: tab,
                        target: document.getElementById(tab.getAttribute('href').slice(1)),
                    };
                })
                .filter(function(item) {
                    return item.target;
                });
            if (!tabTargets.length) return;

            const modalBody = document.getElementById('species-info-body');
            const observer = new IntersectionObserver(function(entries) {
                if (tabBar._pendingTab) {
                    const pendingTarget = document.getElementById(
                        tabBar._pendingTab.getAttribute('href').slice(1)
                    );
                    const pendingEntry = entries.find(function(entry) {
                        return entry.target === pendingTarget;
                    });
                    if (!pendingEntry || !pendingEntry.isIntersecting) return;
                    selectSpeciesTab(tabBar._pendingTab);
                    tabBar._pendingTab = null;
                    return;
                }

                const visible = entries
                    .filter(function(entry) { return entry.isIntersecting; })
                    .sort(function(a, b) {
                        return a.boundingClientRect.top - b.boundingClientRect.top;
                    });
                if (visible.length) {
                    const match = tabTargets.find(function(item) {
                        return item.target === visible[0].target;
                    });
                    if (match) selectSpeciesTab(match.tab);
                }
            }, {
                root: tabBar.closest('#species-info-modal') ? modalBody : null,
                rootMargin: '-10% 0px -65% 0px',
                threshold: [0, 1],
            });

            tabTargets.forEach(function(item) {
                observer.observe(item.target);
            });
            tabBar._sectionObserver = observer;
        });
    }

    document.addEventListener('click', function(event) {
        const tab = event.target.closest('.species-tab');
        if (tab) {
            tab.closest('.species-tabs')._pendingTab = tab;
            selectSpeciesTab(tab);
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        initializeSpeciesTabs(document);
    });
    </script>
</body>
</html>
