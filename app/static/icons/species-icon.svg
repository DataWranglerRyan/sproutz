<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title>Garden field guide book</title>
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6c9b6"/>
      <stop offset="1" stop-color="#b6a48d"/>
    </linearGradient>
  </defs>

  <!-- page edges peeking from the right side -->
  <rect x="366" y="132" width="20" height="248" rx="6" fill="#faf8f5" stroke="#6b8570" stroke-width="8"/>
  <rect x="352" y="120" width="20" height="272" rx="6" fill="#faf8f5" stroke="#6b8570" stroke-width="8"/>

  <!-- book cover -->
  <rect x="126" y="108" width="248" height="296" rx="20" fill="url(#cover)" stroke="#6b8570" stroke-width="14"/>

  <!-- spine -->
  <path d="M162 108v296" fill="none" stroke="#6b8570" stroke-width="12" stroke-linecap="round"/>

  <!-- title lines -->
  <path d="M198 186h136" fill="none" stroke="#f1e6d3" stroke-linecap="round" stroke-width="12"/>
  <path d="M198 226h100" fill="none" stroke="#f1e6d3" stroke-linecap="round" stroke-width="12"/>

  <!-- bookmark ribbon -->
  <path d="M300 108v92l-24-20-24 20v-92Z" fill="#7d9880" stroke="#6b8570" stroke-width="10" stroke-linejoin="round"/>
</svg>
