<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title>Garden flower</title>
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3b8a3"/>
      <stop offset="1" stop-color="#7d9880"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bcd7d4"/>
      <stop offset="1" stop-color="#8fb6b2"/>
    </linearGradient>
  </defs>

  <!-- stem -->
  <path d="M256 430V280" fill="none" stroke="#6b8570" stroke-linecap="round" stroke-width="14"/>

  <!-- leaves -->
  <path d="M256 366c-50 6-84-15-90-56 50-7 88 11 90 56Z" fill="url(#leaf)" stroke="#6b8570" stroke-linejoin="round" stroke-width="10"/>
  <path d="M256 394c50 6 84-15 90-56-50-7-88 11-90 56Z" fill="url(#leaf)" stroke="#6b8570" stroke-linejoin="round" stroke-width="10"/>

  <!-- petals -->
  <g>
    <ellipse cx="256" cy="122" rx="45" ry="70" fill="url(#petal)" stroke="#6b9490" stroke-width="11"/>
    <ellipse cx="256" cy="122" rx="45" ry="70" fill="url(#petal)" stroke="#6b9490" stroke-width="11" transform="rotate(72 256 200)"/>
    <ellipse cx="256" cy="122" rx="45" ry="70" fill="url(#petal)" stroke="#6b9490" stroke-width="11" transform="rotate(144 256 200)"/>
    <ellipse cx="256" cy="122" rx="45" ry="70" fill="url(#petal)" stroke="#6b9490" stroke-width="11" transform="rotate(216 256 200)"/>
    <ellipse cx="256" cy="122" rx="45" ry="70" fill="url(#petal)" stroke="#6b9490" stroke-width="11" transform="rotate(288 256 200)"/>
  </g>

  <!-- flower center -->
  <circle cx="256" cy="200" r="42" fill="#faf8f5" stroke="#6b8570" stroke-width="11"/>
  <circle cx="241" cy="188" r="6" fill="#c9d6c6"/>
  <circle cx="271" cy="188" r="6" fill="#c9d6c6"/>
  <circle cx="256" cy="214" r="6" fill="#c9d6c6"/>
</svg>
